# Preserve campaign parameters when migrating legacy language URLs.
map $args $sns_clean_query {
    default $args;
    ~^(.*)&lang=(?:en|zh)&(.*)$ $1&$2;
    ~^lang=(?:en|zh)&(.*)$ $1;
    ~^(.*)&lang=(?:en|zh)$ $1;
    ~^lang=(?:en|zh)$ "";
}
map $sns_clean_query $sns_query_suffix {
    "" "";
    default ?$sns_clean_query;
}
map "$arg_lang:$uri" $sns_locale_redirect {
    default "";
    "~^zh:/(?:en/)?(?:index\.html)?$" /;
    "~^zh:/(?:en/)?guide(?:/|/index\.html)?$" /guide/;
    "~^zh:/(?:en/)?pricing(?:/|/index\.html)?$" /pricing/;
    "~^zh:/(?:en/)?guides/claude-code-setup(?:/|/index\.html)?$" /guides/claude-code-setup/;
    "~^zh:/(?:en/)?guides/troubleshooting(?:/|/index\.html)?$" /guides/troubleshooting/;
    "~^en:/(?:en/)?(?:index\.html)?$" /en/;
    "~^en:/(?:en/)?guide(?:/|/index\.html)?$" /en/guide/;
    "~^en:/(?:en/)?pricing(?:/|/index\.html)?$" /en/pricing/;
    "~^en:/(?:en/)?guides/claude-code-setup(?:/|/index\.html)?$" /en/guides/claude-code-setup/;
    "~^en:/(?:en/)?guides/troubleshooting(?:/|/index\.html)?$" /en/guides/troubleshooting/;
}

# SunNeverSets static origin. Public traffic reaches this loopback port via Cloudflare Tunnel.
server {
    listen 127.0.0.1:18881;
    server_name sunneversets.ai;
    root /opt/linc/sites/sunneversets/current;
    index index.html;
    server_tokens off;
    # Keep directory redirects on the public HTTPS host behind the tunnel.
    absolute_redirect off;
    access_log /var/log/nginx/sunneversets.access.log;
    error_log /var/log/nginx/sunneversets.error.log;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://sunneversets.ai$request_uri;
    }

    if ($sns_locale_redirect != "") {
        return 301 $sns_locale_redirect$sns_query_suffix;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~* ^/assets/.*\.(js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.(webp|png|svg|ico)$ {
        try_files $uri =404;
        expires 1d;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. {
        return 404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 127.0.0.1:18881;
    server_name www.sunneversets.ai;
    return 301 https://sunneversets.ai$request_uri;
}
